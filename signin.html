<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .signin-container {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    .signin-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .signin-container input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .signin-container button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .signin-container button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <h2>Sign In</h2>
      <form id="signin-form" action="sign_in.php" method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
      <div id="signin-message" style="color:#d9534f; margin-top:12px; text-align:center;"></div>
      <p style="text-align:center; margin-top:10px;">
        Don't have an account? <a href="Sign Up.html">Sign Up</a>
      </p>
    </div>
    <script src="app.js"></script>
