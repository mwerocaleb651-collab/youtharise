<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | YouthArise Manpower Ltd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #471894;
        --accent: #f59e0b;
        --text: #041123;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(120deg, rgba(91, 33, 182, 0.95), rgba(59, 130, 246, 0.85));
        color: var(--white);
        min-height: 100vh;
      }

      .hero {
        min-height: 100vh;
        padding: 24px 6vw 60px;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--white);
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .nav-btn {
        display: inline-block;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        background: rgba(255, 255, 255, 0.16);
        color: var(--white);
      }

      .nav-btn.primary {
        background: var(--accent);
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
      }

      .nav-btn:hover {
        transform: translateY(-2px);
      }

      .logo-wrap {
        display: flex;
        justify-content: center;
        margin-top: 50px;
      }

      .logo {
        width: 180px;
        height: 180px;
        object-fit: contain;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        padding: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }

      .welcome-box {
        max-width: 820px;
        margin: 40px auto 0;
        text-align: center;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.78rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: #e9d5ff;
      }

      h1 {
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.2;
        margin-bottom: 18px;
      }

      .welcome-text {
        font-size: 1.08rem;
        line-height: 1.8;
        color: #f3e8ff;
        max-width: 700px;
        margin: 0 auto 30px;
      }

      .action-row {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 600;
        background: white;
        color: var(--primary);
      }

      .btn.primary {
        background: var(--accent);
        color: white;
      }

      @media (max-width: 768px) {
        .navbar {
          flex-direction: column;
          gap: 15px;
        }

        .logo {
          width: 150px;
          height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <nav class="navbar">
        <a href="index.html" class="brand">YouthArise Manpower Limited</a>
        <div class="nav-links">
          <a href="index.html" class="nav-btn">Home</a>
          <a href="about us.html" class="nav-btn">About Us</a>
          <a href="services.html" class="nav-btn">Services</a>
        </div>
      </nav>

      <div class="logo-wrap">
        <img src="YOUTHARISE MANPOWER LOGO.jpg" alt="YouthArise Manpower Ltd logo" class="logo" />
      </div>

      <section class="welcome-box">
        <p class="eyebrow">Welcome aboard</p>
        <h1>Welcome to YouthArise Manpower Ltd</h1>
        <p class="welcome-text">
          We are delighted to have you with us. YouthArise Manpower Ltd is committed to building
a brighter future through opportunity, talent, integrity, and growth.
        </p>

        <div class="action-row">
          <a href="index.html" class="btn primary">Go to Home</a>
          <a href="about us.html" class="btn">Learn More</a>
        </div>
      </section>
    </header>
  </body>
</html>
